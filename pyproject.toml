[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vigil-supervisor"
version = "0.1.0"
description = "Verification layer for scheduled agents. Exit 0 is not evidence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Katherine Solano" }]
keywords = ["agents", "cron", "scheduling", "observability", "reliability", "ai"]
dependencies = []

[project.urls]
Homepage = "https://github.com/ksolano220/vigil"

[project.scripts]
vigil = "vigil.cli:main"

[tool.setuptools]
packages = ["vigil"]
